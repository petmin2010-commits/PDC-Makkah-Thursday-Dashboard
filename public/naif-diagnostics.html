<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تشخيص نايف | أبعاد الرؤية</title><style>body{margin:0;font:16px Tahoma,Arial;background:#f4f7f5;color:#21362d}header{background:linear-gradient(110deg,#114b3a,#27765c);color:white;padding:25px max(22px,5vw)}main{max-width:1050px;margin:26px auto;padding:0 18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button,a.action{border:0;border-radius:9px;background:#145c45;color:white;padding:12px 18px;cursor:pointer;text-decoration:none;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.item{background:white;border:1px solid #dee6e1;border-radius:12px;padding:18px;box-shadow:0 3px 10px #173c2609}.item h3{margin:0 0 9px;font-size:16px}.meta{color:#65766c;font-size:13px;overflow-wrap:anywhere}.ok{color:#176640}.error{color:#ad3c35}.other{color:#8b641c}.notice{background:#fff;border-right:4px solid #ba9136;padding:14px;margin:15px 0;line-height:1.8}.summary{font-weight:bold;margin:15px 0}small{opacity:.84}</style></head><body><header><h1>التشخيص الذاتي للوكيل نايف</h1><div>فحص فعلي للخدمات المتاحة — مكة / جدة</div></header><main><div class="actions"><button id="run">إعادة التشخيص</button><a class="action" href="/">العودة للداش بورد</a><button id="save">نسخ نتيجة التشخيص</button></div><div class="notice">هذا التشخيص للقراءة فقط. عبارة «تم إعداد المفتاح» لا تعني نجاح المحادثة، والخدمات التي لم تُفحص تعرض «لم يُختبر» بدلًا من نتيجة نجاح افتراضية.</div><div id="summary" class="summary">جارٍ قراءة النتيجة...</div><div id="results" class="grid"></div><p class="meta" id="time"></p></main><script>
const labels={runtime:'تشغيل الخادم',openaiKey:'إعداد مفتاح الذكاء الاصطناعي',naifConversation:'محادثة نايف',voiceAndCalls:'الصوت والمكالمات',pcloud:'ارتباط pCloud',googleSheets:'Google Sheets'};
const statuses={ok:'سليم',error:'خطأ',configured:'معدّ، لم يُختبر',not_configured:'غير معدّ',not_tested:'لم يُختبر',warning:'تحذير'};
let latest=null;
async function run(){
document.getElementById('summary').textContent='جارٍ إجراء فحوصات القراءة فقط...';
try {const response=await fetch('/api/naif/diagnostics',{credentials:'same-origin',cache:'no-store'});if(response.status===401){document.getElementById('summary').textContent='يلزم تسجيل الدخول لإجراء الفحص';return}if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();latest=data;document.getElementById('summary').textContent='المشروع: '+data.city+' | سليم: '+data.counts.ok+' | أخطاء: '+data.counts.error+' | غير مكتمل الفحص: '+data.counts.notTested;
document.getElementById('results').replaceChildren(...data.checks.map(x=>{const div=document.createElement('article');div.className='item';const h=document.createElement('h3');h.textContent=labels[x.name]||x.name;const p=document.createElement('p');p.className=x.status==='ok'?'ok':x.status==='error'?'error':'other';p.textContent=statuses[x.status]||x.status;const detail=document.createElement('div');detail.className='meta';detail.textContent=[x.reason,x.note,x.tabCount!==undefined?'عدد الأوراق: '+x.tabCount:null,x.elapsedMs!==undefined?'المدة: '+x.elapsedMs+'ms':null].filter(Boolean).join(' — ');div.append(h,p,detail);return div}));document.getElementById('time').textContent='وقت الفحص: '+new Date(data.generatedAt).toLocaleString('ar-SA');}
catch(e){document.getElementById('summary').textContent='تعذر الاتصال بالتشخيص: '+e.message}}
document.getElementById('run').onclick=run;document.getElementById('save').onclick=()=>{if(latest)navigator.clipboard?.writeText(JSON.stringify(latest,null,2))};run();
</script></body></html>
