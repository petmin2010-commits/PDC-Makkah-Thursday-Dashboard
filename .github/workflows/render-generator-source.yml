name: Render source PowerPoint for generator reports
on:
  push:
    paths:
      - templates/temporary-generators-original.pptx
      - scripts/generator_original_assets.py
      - .github/workflows/render-generator-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the original PowerPoint renderer
        run: |
          if ! command -v libreoffice; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-impress
          fi
          python -m pip install python-pptx pymupdf pillow
      - name: Render actual source slides (not redesigned HTML)
        run: python scripts/generator_original_assets.py
      - name: Commit unchanged original slide backgrounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/generator-template/*.webp
          if ! git diff --staged --quiet; then
            git commit -m "Build generators source-image layout [skip ci]"
            git push
          fi
